[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F7"
textColor = "#1C1F23"
font = "sans serif"

[server]
# Local runs bind to 127.0.0.1 via the command line (Makefile, README); a host sets its own address.
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
