name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # Ollama isn't available in CI; live tests skip themselves. MCP smoke tests run here.
      - run: uv run pytest -q
      - run: uv run python eval/run_eval.py
